# Stage examples/dscv3/Invoke-VisualStudio2022Migration.ps1 at the path below first.
# Run elevated as the user whose IDE settings are being migrated, never as SYSTEM.
# See examples/dscv3/VisualStudio2022Migration.md for prerequisites and recovery.
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  - name: BackupAndRemoveVisualStudio2022Enterprise
    type: AppNetOnline.Pinned/App
    properties:
      Ensure: Absent
      Name: Visual Studio Enterprise 2022
      InstalledCheckFilePath: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\devenv.exe
      InstallerPath: C:\ANS\VisualStudioMigration\vs_enterprise.exe
      ArgumentsForUninstall: uninstall --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --quiet --wait --norestart
      PreAction: |
        & 'C:\ANS\Scripts\Invoke-VisualStudio2022Migration.ps1' -Phase Backup -Confirm:$false
      ReturnCode: [0]
      ProcessTimeout: 7200
      NoRestart: true

  - name: InstallVisualStudio2022Professional
    type: AppNetOnline.Pinned/App
    dependsOn:
      - "[resourceId('AppNetOnline.Pinned/App','BackupAndRemoveVisualStudio2022Enterprise')]"
    properties:
      Ensure: Present
      Name: Visual Studio Professional 2022
      InstalledCheckFilePath: C:\Program Files\Microsoft Visual Studio\2022\Professional\Common7\IDE\devenv.exe
      InstallerPath: C:\ANS\VisualStudioMigration\vs_professional.exe
      Version: latest
      Arguments: --quiet --wait --norestart --installPath "C:\Program Files\Microsoft Visual Studio\2022\Professional" --config "C:\ANS\VisualStudioMigration\Enterprise.vsconfig"
      PreAction: |
        & 'C:\ANS\Scripts\Invoke-VisualStudio2022Migration.ps1' -Phase Validate -Confirm:$false
      ReturnCode: [0]
      ProcessTimeout: 7200
      NoRestart: true
      PatchOnly: false

  - name: ApplyVisualStudio2022ProfessionalConfiguration
    type: AppNetOnline.Pinned/App
    dependsOn:
      - "[resourceId('AppNetOnline.Pinned/App','InstallVisualStudio2022Professional')]"
    properties:
      Ensure: Present
      Name: Visual Studio Professional 2022
      InstalledCheckFilePath: C:\Program Files\Microsoft Visual Studio\2022\Professional\Common7\IDE\devenv.exe
      InstalledCheckScript: |
        $marker = 'C:\ANS\VisualStudioMigration\Complete.json'
        if (-not (Test-Path -LiteralPath $marker)) { return $false }
        if (Test-Path -LiteralPath 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\devenv.exe') { return $false }
        if (-not (Test-Path -LiteralPath 'C:\Program Files\Microsoft Visual Studio\2022\Professional\Common7\IDE\devenv.exe')) { return $false }
        try {
            $state = Get-Content -LiteralPath $marker -Raw -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop
            return ($state.UserSid -eq [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value -and $state.ComputerName -eq $env:COMPUTERNAME)
        } catch { return $false }
      InstallerPath: C:\ANS\VisualStudioMigration\vs_professional.exe
      Version: latest
      Arguments: modify --quiet --wait --norestart --installPath "C:\Program Files\Microsoft Visual Studio\2022\Professional" --config "C:\ANS\VisualStudioMigration\Enterprise.vsconfig"
      PreAction: |
        & 'C:\ANS\Scripts\Invoke-VisualStudio2022Migration.ps1' -Phase Validate -Confirm:$false
      PostAction: |
        & 'C:\ANS\Scripts\Invoke-VisualStudio2022Migration.ps1' -Phase Restore -Confirm:$false
      ReturnCode: [0]
      ProcessTimeout: 7200
      NoRestart: true
      PatchOnly: false
