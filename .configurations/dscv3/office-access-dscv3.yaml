$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  - name: InstallMicrosoftAccess
    type: AppNetOnline.Pinned/App
    properties:
      Ensure: Present
      Name: Microsoft Access
      InstallerPath: https://officecdn.microsoft.com/pr/wsus/setup.exe
      Version: latest
      Arguments: /configure Office-InstallAccess.xml
      WorkingDirectory: C:\ANS\Installers\Office
      PreAction: if (-not (Test-Path 'C:\ANS\Installers\Office')) { New-Item -Path 'C:\ANS\Installers\Office' -ItemType Directory -Force | Out-Null }; Invoke-WebRequest -Uri 'https://officecdn.microsoft.com/pr/wsus/setup.exe' -OutFile 'C:\ANS\Installers\Office\setup.exe' -UseBasicParsing; Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/AppNetDev/ans-dsc-pinned/master/.configurations/resources/Office-RemoveAccessRuntime.xml' -OutFile 'C:\ANS\Installers\Office\Office-RemoveAccessRuntime.xml' -UseBasicParsing; Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/AppNetDev/ans-dsc-pinned/master/.configurations/resources/Office-InstallAccess.xml' -OutFile 'C:\ANS\Installers\Office\Office-InstallAccess.xml' -UseBasicParsing; & 'C:\ANS\Installers\Office\setup.exe' /configure 'C:\ANS\Installers\Office\Office-RemoveAccessRuntime.xml'
      InstalledCheckScript: Test-Path 'C:\Program Files\Microsoft Office\root\Office16\MSACCESS.EXE'
      PatchOnly: false
